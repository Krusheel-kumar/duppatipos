version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: krunnex-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-krunnex_pos}
      POSTGRES_USER: ${DB_USER:-krunnex}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-krunnex_secret}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-krunnex} -d ${DB_DB:-krunnex_pos}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
